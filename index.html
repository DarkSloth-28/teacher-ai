<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Teacher — Teach me till I get it.</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f7fb;
  color: #172033;
}

header {
  height: 70px;
  background: white;
  border-bottom: 1px solid #e5e7eb;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 25px;
  position: sticky;
  top: 0;
  z-index: 10;
}

.logo {
  font-size: 23px;
  font-weight: 800;
}

.plus {
  background: #172033;
  color: white;
  border: none;
  padding: 11px 18px;
  border-radius: 12px;
  font-weight: bold;
  cursor: pointer;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 35px 20px;
}

.hero {
  text-align: center;
  margin-bottom: 25px;
}

.hero h1 {
  font-size: 42px;
  margin: 10px 0;
}

.hero p {
  color: #667085;
  font-size: 17px;
}

.subject {
  display: block;
  width: 100%;
  padding: 14px;
  border: 1px solid #d8dce5;
  border-radius: 12px;
  background: white;
  font-size: 15px;
  margin-bottom: 15px;
}

.chat {
  background: white;
  border: 1px solid #e3e6ed;
  border-radius: 18px;
  min-height: 430px;
  padding: 20px;
  box-shadow: 0 8px 30px rgba(0,0,0,0.04);
}

.message {
  margin: 12px 0;
  padding: 13px 16px;
  border-radius: 14px;
  max-width: 80%;
  line-height: 1.5;
  white-space: pre-wrap;
}

.user {
  background: #172033;
  color: white;
  margin-left: auto;
}

.ai {
  background: #eef1f6;
  color: #172033;
  margin-right: auto;
}

.input-area {
  display: flex;
  gap: 10px;
  margin-top: 15px;
}

input {
  flex: 1;
  padding: 15px;
  border: 1px solid #d8dce5;
  border-radius: 13px;
  font-size: 16px;
  outline: none;
}

.send {
  padding: 0 22px;
  border: none;
  border-radius: 13px;
  background: #172033;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

.send:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.status {
  text-align: center;
  color: #667085;
  font-size: 13px;
  margin-top: 10px;
}

@media (max-width: 600px) {
  .hero h1 {
    font-size: 32px;
  }

  .message {
    max-width: 90%;
  }

  .input-area {
    flex-direction: column;
  }

  .send {
    padding: 14px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">🎓 AI Teacher</div>
  <button class="plus" onclick="showPlus()">AI Teacher Plus</button>
</header>

<div class="container">

  <div class="hero">
    <h1>Teach me till I get it.</h1>
    <p>Your personal AI tutor for school, homework and exam prep.</p>
  </div>

  <select id="subject" class="subject">
    <option>General</option>
    <option>Physics</option>
    <option>Chemistry</option>
    <option>Biology</option>
    <option>Mathematics</option>
    <option>English</option>
    <option>Computer Science</option>
  </select>

  <div class="chat" id="chat">
    <div class="message ai">
      Hey! 👋 I'm your AI Teacher.

Tell me what you're stuck on and I'll explain it step by step.
    </div>
  </div>

  <div class="input-area">
    <input
      id="message"
      type="text"
      placeholder="Ask me anything..."
      onkeydown="if(event.key === 'Enter') sendMessage()"
    >

    <button class="send" id="sendButton" onclick="sendMessage()">
      Send
    </button>
  </div>

  <div class="status" id="status"></div>

</div>

<script>

const WORKER_URL =
"https://ai-teacher-api.superspiderlazer.workers.dev";

async function sendMessage() {

  const input = document.getElementById("message");
  const chat = document.getElementById("chat");
  const button = document.getElementById("sendButton");
  const status = document.getElementById("status");
  const subject = document.getElementById("subject").value;

  const message = input.value.trim();

  if (!message) return;

  // Show user message
  const userMessage = document.createElement("div");
  userMessage.className = "message user";
  userMessage.textContent = message;
  chat.appendChild(userMessage);

  input.value = "";
  button.disabled = true;
  status.textContent = "AI Teacher is thinking...";

  try {

    const response = await fetch(WORKER_URL, {
      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        message:
          "Subject: " + subject +
          "\nStudent question: " + message
      })
    });

    const data = await response.json();

    const aiMessage = document.createElement("div");
    aiMessage.className = "message ai";

    if (data.answer) {
      aiMessage.textContent = data.answer;
    } else {
      aiMessage.textContent =
        "Sorry, something went wrong: " +
        (data.error || "Unknown error");
    }

    chat.appendChild(aiMessage);

  } catch (error) {

    const aiMessage = document.createElement("div");
    aiMessage.className = "message ai";

    aiMessage.textContent =
      "I couldn't connect to the AI server. Please try again.";

    chat.appendChild(aiMessage);

  }

  button.disabled = false;
  status.textContent = "";
  input.focus();

  chat.scrollTop = chat.scrollHeight;
}

function showPlus() {

  alert(
    "AI Teacher Plus\n\n" +
    "• Higher AI usage\n" +
    "• Exam-style answers\n" +
    "• Study plans\n" +
    "• Practice tests\n" +
    "• Image/question uploads\n" +
    "• Saved progress\n\n" +
    "Plus — $4.99/month"
  );

}

</script>

</body>
</html>
